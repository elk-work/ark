name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ensure a release exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 ||
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes

  binaries:
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          name="ark_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          bin=ark
          if [ "$GOOS" = windows ]; then bin=ark.exe; fi
          go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/${name}/${bin}" ./cmd/ark
          cp README.md LICENSE "dist/${name}/"
          if [ "$GOOS" = windows ]; then
            (cd dist && python3 -c "import shutil; shutil.make_archive('${name}', 'zip', '${name}')")
            (cd dist && shasum -a 256 "${name}.zip" > "${name}.zip.sha256")
            asset="dist/${name}.zip"
            sum="dist/${name}.zip.sha256"
          else
            tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
            asset="dist/${name}.tar.gz"
            sum="dist/${name}.tar.gz.sha256"
          fi
          echo "ASSET=${asset}" >> "$GITHUB_ENV"
          echo "SUM=${sum}" >> "$GITHUB_ENV"
      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$ASSET" "$SUM" --clobber
