name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
      # The CLA gate is a shell script rather than Go, and it is the one thing
      # in this repository whose failures would otherwise surface on an
      # outside contributor's pull request instead of on ours.
      # `--severity=warning` because the runner's ShellCheck is a version or
      # two behind a developer's and its style advice moves between them; its
      # warnings do not.
      - name: cla script
        run: |
          shellcheck --severity=warning --shell=bash scripts/cla.sh scripts/cla-test.sh
          bash scripts/cla-test.sh

  windows:
    runs-on: windows-latest
    steps:
      # Check out the way a Windows developer actually does. Git for Windows
      # defaults to core.autocrlf=true; without pinning it here the job would
      # inherit whatever the runner image happens to set, so a regression in
      # .gitattributes — the whole point of this job — could pass unnoticed.
      - name: check out newlines the way Git for Windows does
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: line endings
        shell: pwsh
        run: |
          # Pass the paths as arguments rather than piping them into
          # `git check-attr --stdin`: PowerShell terminates piped lines with
          # CRLF and prefixes a BOM, so every path would come back unmatched
          # and the check would silently measure nothing.
          $tracked = @(git ls-files)
          $pinned = @(git check-attr eol -- $tracked | ForEach-Object {
            if ($_ -match '^(.+): eol: lf$') { $Matches[1] }
          })
          if ($pinned.Count -eq 0) {
            Write-Output '.gitattributes pins no file to LF; it is missing or broken.'
            exit 1
          }
          $converted = @($pinned | Where-Object {
            [System.IO.File]::ReadAllBytes((Join-Path $PWD $_)) -contains 13
          })
          if ($converted.Count -ne 0) {
            Write-Output 'CRLF in files .gitattributes pins to LF:'
            $converted | ForEach-Object { Write-Output "  $_" }
            exit 1
          }
          Write-Output "$($pinned.Count) of $($tracked.Count) tracked files pinned to LF, all verified"
      - name: gofmt
        shell: pwsh
        run: |
          $files = @(gofmt -l .)
          if ($files.Count -ne 0) {
            $files | Write-Error
            exit 1
          }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      # The suite above substitutes a fake keyring, deliberately —
      # internal/cloud/keyring_test.go says why. That proves the resolution
      # order and nothing whatever about wincred, which is how v0.6.0 came to
      # ship a Windows credential path verified only to compile, vet and pass
      # (elk-work/ark#38). The hosted runner signs in as an ordinary
      # interactive user, so Credential Manager is reachable here and the
      # round-trip is a real one.
      - name: live Credential Manager round-trip
        env:
          ARK_KEYRING_LIVE: "1"
        run: go test -run TestLive -v ./internal/cloud

  # A hosted Linux runner has no Secret Service and no session bus at all, so
  # this job brings both up: gnome-keyring holding an unlocked login keyring on
  # a bus of its own. Without them the live tests do not degrade quietly, they
  # fail at the first Set — go-keyring's Linux backend speaks D-Bus and there
  # would be nothing on the other end. The recipe is go-keyring's own CI.
  keyring-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install gnome-keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring
      - name: live Secret Service round-trip
        # dbus-run-session wraps the whole step in a private session bus, which
        # the daemon then claims as org.freedesktop.secrets. The unlock
        # password is in the clear because it guards a keyring created seconds
        # earlier on a machine destroyed at the end of the job: it protects
        # nothing, and pulling it from a secret would only imply otherwise.
        shell: dbus-run-session -- bash --noprofile --norc -eo pipefail {0}
        env:
          ARK_KEYRING_LIVE: "1"
        run: |
          mkdir -p "$HOME/.local/share/keyrings"
          chmod 700 "$HOME/.local/share/keyrings"
          echo 'ark-ci-keyring' | gnome-keyring-daemon --unlock
          go test -run TestLive -v ./internal/cloud

  # macOS is the one platform anybody ever drove live by hand, which is exactly
  # why it is here: a verification nobody repeats stops being one the next time
  # the code moves. Nothing has to be arranged first — the runner's login
  # keychain is already the default and already unlocked, no-timeout.
  keyring-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: live Keychain round-trip
        env:
          ARK_KEYRING_LIVE: "1"
        run: go test -run TestLive -v ./internal/cloud
