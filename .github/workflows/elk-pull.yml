# Delivers synced Ark repositories into Elk on a timer — the "Elk-side puller"
# of docs/rfc-0002-elk-work-record-adapter.md, stage 2.
#
# There is no new program here on purpose. A puller is an Ark client that joins
# a repository, syncs, and pushes its events to Elk; every part of that already
# exists and is tested. Writing a second normalizer in TypeScript or Node would
# duplicate ~600 lines of Go that owns Ark's record semantics.
#
# Safe to run repeatedly and safe to overlap with a developer running
# `ark elk push` by hand: Elk deduplicates on the event key, so a repeated
# delivery is a no-op and there is no cursor to corrupt.
#
# ── DO NOT ENABLE BEFORE THE SERVER CARRIES THE REGISTRATION-BACKFILL FIX ──
# This workflow joins each repository from a scratch checkout that has no Git
# remote. Against a server that still overwrites metadata on registration, that
# clears git_remote_url on every run — measured, on live repositories, which is
# what prompted the fix. The fix must be deployed first.
#
# The workflow is inert until the ELK_PULL_REPOSITORIES repository variable is
# set, so merging it changes nothing. Setting that variable is the switch.

name: elk-pull

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      repositories:
        description: "Override: space-separated name=repository-id pairs"
        required: false

concurrency:
  group: elk-pull
  cancel-in-progress: true

jobs:
  pull:
    runs-on: ubuntu-latest
    # Skip silently on forks and before the secrets exist, rather than failing
    # a scheduled job every quarter hour.
    if: github.repository == 'elkproject/ark'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build ark
        run: go build -o "$RUNNER_TEMP/ark" ./cmd/ark

      - name: Deliver each repository
        env:
          ARK_REMOTE: ${{ secrets.ARK_SERVER_URL }}
          ARK_TOKEN: ${{ secrets.ARK_SERVER_TOKEN }}
          ARK_ELK_ENDPOINT: ${{ secrets.ELK_ARK_INGEST_URL }}
          ARK_ELK_TOKEN: ${{ secrets.ELK_ARK_INGEST_TOKEN }}
          # name=repository-id pairs. The name matters: it becomes the working
          # directory, which is what the client reports at registration.
          REPOSITORIES: ${{ github.event.inputs.repositories || vars.ELK_PULL_REPOSITORIES }}
        run: |
          if [ -z "$ARK_REMOTE" ] || [ -z "$ARK_ELK_ENDPOINT" ]; then
            echo "secrets not configured; nothing to do"; exit 0
          fi
          if [ -z "$REPOSITORIES" ]; then
            echo "no repositories configured (set the ELK_PULL_REPOSITORIES variable)"; exit 0
          fi
          status=0
          for pair in $REPOSITORIES; do
            name="${pair%%=*}"; id="${pair#*=}"
            echo "::group::$name ($id)"
            work="$RUNNER_TEMP/pull/$name"
            mkdir -p "$work" && cd "$work"
            git init -q . && git commit -q --allow-empty -m "elk-pull scratch"
            if "$RUNNER_TEMP/ark" init --repository "$id" >/dev/null \
              && "$RUNNER_TEMP/ark" remote set "$ARK_REMOTE" >/dev/null \
              && "$RUNNER_TEMP/ark" sync \
              && "$RUNNER_TEMP/ark" elk push; then
              :
            else
              echo "::error::$name ($id) failed"; status=1
            fi
            cd - >/dev/null
            echo "::endgroup::"
          done
          exit $status
