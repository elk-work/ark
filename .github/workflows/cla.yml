name: cla

# The Contributor License Agreement gate. The logic is scripts/cla.sh, which
# carries the full design and security notes; this file is the wiring.
#
# It used to be contributor-assistant/github-action@v2.6.1, which declares
# `runs.using: node20`, has an archived upstream, and was being force-shimmed
# onto Node 24 — elk-work/ark#50. There was nothing to bump to.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

# `closed` is deliberately absent. In the retired action that event did one
# thing — lock the pull request's conversation, on by default — so that a
# contributor could not delete the comment their signature was made of. Our
# record of a signature is signatures/cla.json committed to `main`, plus that
# file's git history, so a deleted comment un-signs nobody. What locking did
# do was silence every closed pull request in the repository, internal ones
# included.

# Least privilege. `pull_request_target` runs with a token that can write to
# this repository while the code under review is a stranger's, so each scope
# here has to earn its place:
#
#   contents: write      check out `main` for the script, and commit the
#                        updated signatures/cla.json back to `main`.
#   pull-requests: write create and update the one "please sign" comment.
#                        (Only pull requests are ever commented on, which is
#                        why this is not `issues: write`.)
#   statuses: write      publish the `cla-assistant` commit status, which is
#                        the gate itself.
#
# `actions: write` went with the action. It was there so the action could
# re-run the earlier failed workflow run once somebody signed, because a job's
# conclusion cannot be rewritten. A commit status can be, and the
# issue_comment run rewrites it directly, so nothing needs re-running.
permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  # Serialised per pull request so two comments cannot race each other into
  # the same commit on `main`. Two different pull requests still can, and
  # scripts/cla.sh retries on the stale-blob conflict that produces.
  group: cla-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # This job goes green whenever the check ran, signed or not. The verdict is
  # the `cla-assistant` commit status it publishes on the pull request's head
  # commit — that is the name to look for on a pull request, and the one thing
  # a later `recheck` or signature can turn green.
  cla:
    name: cla
    runs-on: ubuntu-latest
    # `issue_comment` fires on ordinary issues too, and an issue has no CLA.
    # The body test here is deliberately looser than the script's (`contains`
    # is case-insensitive and unanchored) so that the exact rule lives in one
    # tested place and this can only ever narrow what reaches it.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request.url &&
      (contains(github.event.comment.body, 'hereby sign the CLA') ||
      contains(github.event.comment.body, 'recheck')))
    steps:
      # `main`, by name — never the pull request's head. Nothing from the
      # contributor's branch is fetched, checked out, built or executed
      # anywhere in this workflow.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Every webhook value reaches the script as an environment variable and
      # none is interpolated into the shell. Comment bodies, logins and branch
      # names are contributor-controlled, and `${{ }}` is textual substitution
      # performed before the shell ever sees the line.
      - name: cla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CLA_EVENT: ${{ github.event_name }}
          CLA_ALLOWLIST: ijroth,dependabot[bot],Claude
          CLA_DOCUMENT_URL: https://github.com/elk-work/ark/blob/main/CLA.md
          CLA_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLA_REPO_ID: ${{ github.event.repository.id }}
          CLA_PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          CLA_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CLA_ISSUE_PR_URL: ${{ github.event.issue.pull_request.url }}
          CLA_COMMENT_BODY: ${{ github.event.comment.body }}
          CLA_COMMENT_ID: ${{ github.event.comment.id }}
          CLA_COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          CLA_COMMENT_USER_ID: ${{ github.event.comment.user.id }}
          CLA_COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: bash scripts/cla.sh
